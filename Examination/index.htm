  <!-- ============================================================

  <script>
    /* ── Animated Water ── */
    AFRAME.registerComponent('water-anim', {
      schema: { speed: { type: 'number', default: 0.4 }, color1: { type: 'color', default: '#1a78c2' }, color2: { type: 'color', default: '#0d4f8c' } },
      init() {
        this.t = 0;
        const mesh = this.el.getObject3D('mesh');
        if (mesh) {
          mesh.material.transparent = true;
          mesh.material.opacity = 0.82;
        }
      },
      tick(time, delta) {
        this.t += delta * 0.001 * this.data.speed;
        const mesh = this.el.getObject3D('mesh');
        if (!mesh) return;
        // Oscillate position.y to simulate waves
        this.el.object3D.position.y = -0.08 + Math.sin(this.t * 2.3) * 0.04;
        // Cycle color
        const lerp = (Math.sin(this.t) + 1) / 2;
        const c1 = new THREE.Color(this.data.color1);
        const c2 = new THREE.Color(this.data.color2);
        c1.lerp(c2, lerp);
        mesh.material.color.set(c1);
        mesh.material.needsUpdate = true;
      }
    });

    /* ── Ripple Rings ── */
    AFRAME.registerComponent('ripple', {
      schema: { speed: { type: 'number', default: 0.6 } },
      init() {
        this.t = 0;
        this.scale0 = { x: 1, y: 1, z: 1 };
      },
      tick(time, delta) {
        this.t += delta * 0.001 * this.data.speed;
        const s = 1 + Math.sin(this.t * 3) * 0.06;
        this.el.object3D.scale.set(s, 1, s);
        this.el.object3D.position.y = Math.sin(this.t * 2) * 0.03;
      }
    });

    /* ── Float Animation ── */
    AFRAME.registerComponent('float-anim', {
      schema: { amplitude: { type: 'number', default: 0.15 }, speed: { type: 'number', default: 1 } },
      init() {
        this.t = Math.random() * Math.PI * 2;
        this.baseY = this.el.object3D.position.y;
      },
      tick(time, delta) {
        this.t += delta * 0.001 * this.data.speed;
        this.el.object3D.position.y = this.baseY + Math.sin(this.t) * this.data.amplitude;
      }
    });

    /* ── Fan Spin ── */
    AFRAME.registerComponent('fan-spin', {
      schema: { speed: { type: 'number', default: 200 } },
      tick(time, delta) {
        this.el.object3D.rotation.y += (delta * 0.001) * (this.data.speed * Math.PI / 180);
      }
    });

    /* ── Curtain Sway ── */
    AFRAME.registerComponent('curtain-sway', {
      schema: { amplitude: { type: 'number', default: 0.04 } },
      init() { this.t = Math.random() * Math.PI * 2; },
      tick(time, delta) {
        this.t += delta * 0.001 * 0.8;
        this.el.object3D.rotation.z = Math.sin(this.t) * this.data.amplitude;
      }
    });

    /* ── Flame Flicker ── */
    AFRAME.registerComponent('flame-flicker', {
      init() { this.t = 0; },
      tick(time, delta) {
        this.t += delta * 0.001;
        const s = 0.85 + Math.random() * 0.3;
        this.el.object3D.scale.set(s, 0.9 + Math.random() * 0.4, s);
        const mesh = this.el.getObject3D('mesh');
        if (mesh) {
          const b = 0.7 + Math.random() * 0.3;
          mesh.material.emissiveIntensity = b;
        }
      }
    });

    /* ── Car Idle (subtle bounce) ── */
    AFRAME.registerComponent('car-idle', {
      init() { this.t = Math.random() * Math.PI * 2; this.baseY = this.el.object3D.position.y; },
      tick(time, delta) {
        this.t += delta * 0.001 * 1.2;
        this.el.object3D.position.y = this.baseY + Math.sin(this.t * 2) * 0.012;
      }
    });

    /* ── Leaf Rustle ── */
    AFRAME.registerComponent('leaf-rustle', {
      init() { this.t = Math.random() * Math.PI * 2; },
      tick(time, delta) {
        this.t += delta * 0.001 * 0.7;
        this.el.object3D.rotation.z = Math.sin(this.t) * 0.08;
        this.el.object3D.rotation.x = Math.sin(this.t * 1.3) * 0.05;
      }
    });

    /* ── Keypress fly toggle ── */
    document.addEventListener('keydown', e => {
      if (e.key === 'f' || e.key === 'F') {
        const cam = document.querySelector('#player');
        const fly = cam.getAttribute('movement-controls');
        const isFly = fly && fly.fly === true;
        cam.setAttribute('movement-controls', `fly: ${!isFly}; speed: 4;`);
      }
      if (e.key === 'e' || e.key === 'E') {
        const scene = document.querySelector('a-scene');
        if (scene.is('vr-mode')) scene.exitVR(); else scene.enterVR();
      }
    });

    /* ── Hide loading screen ── */
    window.addEventListener('load', () => {
      setTimeout(() => {
        const ls = document.getElementById('loading-screen');
        ls.style.opacity = '0';
        setTimeout(() => ls.remove(), 900);
      }, 2400);
    });
  </script>

    <!-- Procedural texture generator -->
    <script>
      (function generateTextures() {

        // Marble
        const marble = document.getElementById('tex-marble');
        const mc = marble.getContext('2d');
        for (let x = 0; x < 256; x++) for (let y = 0; y < 256; y++) {
          const v = Math.floor(255 * (0.75 + 0.25 * Math.sin((x + y) * 0.05 + Math.sin(x * 0.03) * 5)));
          mc.fillStyle = `rgb(${v},${v - 5},${v - 10})`;
          mc.fillRect(x, y, 1, 1);
        }

        // Wood
        const wood = document.getElementById('tex-wood');
        const wc = wood.getContext('2d');
        for (let x = 0; x < 256; x++) for (let y = 0; y < 256; y++) {
          const ring = Math.floor((Math.sin(Math.sqrt((x - 128) ** 2 + (y - 128) ** 2) * 0.25) + 1) * 4) % 2;
          const r = ring ? 139 : 101;
          const g = ring ? 90 : 67;
          const b = ring ? 43 : 33;
          wc.fillStyle = `rgb(${r + Math.random() * 15 | 0},${g + Math.random() * 10 | 0},${b + Math.random() * 8 | 0})`;
          wc.fillRect(x, y, 1, 1);
        }

        // Concrete
        const con = document.getElementById('tex-concrete');
        const cc = con.getContext('2d');
        for (let x = 0; x < 256; x++) for (let y = 0; y < 256; y++) {
          const v = 180 + Math.random() * 30;
          cc.fillStyle = `rgb(${v | 0},${v | 0},${v | 0})`;
          cc.fillRect(x, y, 1, 1);
        }

        // Water
        const wat = document.getElementById('tex-water');
        const wac = wat.getContext('2d');
        const grad = wac.createLinearGradient(0, 0, 256, 256);
        grad.addColorStop(0, '#1a78c2');
        grad.addColorStop(0.5, '#1e8cd9');
        grad.addColorStop(1, '#0d5fa8');
        wac.fillStyle = grad;
        wac.fillRect(0, 0, 256, 256);

        for (let i = 0; i < 200; i++) {
          wac.beginPath();
          wac.arc(Math.random() * 256, Math.random() * 256, Math.random() * 8, 0, Math.PI * 2);
          wac.strokeStyle = 'rgba(255,255,255,0.12)';
          wac.lineWidth = 1;
          wac.stroke();
        }

      })();
    </script>

    <!-- BEACH BALL -->
    <a-entity 
  gltf-model="#ballModel"
  position="-5 0.5 12"
  scale="0.5 0.5 0.5"
  shadow="cast:true; receive:true">
  <script>
    // Realistic bounce/floating animation
    AFRAME.registerComponent('ball-bounce', {
      schema: {
        amplitude: { type: 'number', default: 0.5 },  // how high it bounces
        speed: { type: 'number', default: 2 },        // bounce speed
        rotationSpeed: { type: 'number', default: 60 } // rotation in degrees per second
      },
      init: function () {
        this.t = 0;
        this.baseY = this.el.object3D.position.y;
      },
      tick: function (time, deltaTime) {
        // Bouncing up and down
        this.t += deltaTime * 0.001 * this.data.speed;
        this.el.object3D.position.y = this.baseY + Math.abs(Math.sin(this.t)) * this.data.amplitude;
  
        // Slight rotation for realism
        this.el.object3D.rotation.x += THREE.MathUtils.degToRad(this.data.rotationSpeed * deltaTime * 0.001);
        this.el.object3D.rotation.z += THREE.MathUtils.degToRad(this.data.rotationSpeed * deltaTime * 0.001);
      }
    });
  </script>
  
  
  
  
  
</a-entity>
